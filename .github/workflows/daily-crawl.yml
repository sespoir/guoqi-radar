name: Collect recruitment data and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 1 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect current recruitment data
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > runner.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:4173/api/jobs > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -100 runner.log
              exit 1
            fi
            sleep 2
          done

          curl --fail-with-body --retry 2 --max-time 1200 \
            -X POST http://localhost:4173/api/agent/run \
            -H "X-Agent-Local: true"

          curl --fail-with-body --retry 2 \
            http://localhost:4173/api/jobs \
            --output docs/data/jobs.json

      - name: Validate public data
        run: node scripts/validate-pages-data.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
